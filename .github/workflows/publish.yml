name: Publish to NuGet (OIDC Trust)

on:
  push:
    tags:
      - 'v*.*.*' # Triggers automatically when pushing tags like v1.0.3

permissions:
  id-token: write # Mandatory for Trusted Publishing OIDC token exchange
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup .NET 10 Environment
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. Restore project dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Build the solution in Release configuration
    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    # 5. Run the High-Concurrency Multi-threaded Stress Test
    - name: Run Production Performance Tests
      run: dotnet test --configuration Release --no-build

    # 6. Generate the .nupkg artifacts
    - name: Pack Library
      run: dotnet pack --configuration Release --no-build --output ./nupkg

    # 7. Securely push to NuGet via OIDC Trusted Publishing (No API Key Required!)
    - name: Push Package to NuGet.org
      run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.org --skip-duplicate