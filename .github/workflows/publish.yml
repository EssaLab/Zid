name: Publish to NuGet (OIDC Trust)

on:
  push:
    tags:
      - 'v*.*.*' # Triggers automatically when pushing tags like v1.0.3

permissions:
  id-token: write # Mandatory for Trusted Publishing OIDC token exchange
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Run Production Performance Tests
        run: dotnet test --configuration Release --no-build

      - name: Pack Library
        run: dotnet pack --configuration Release --no-build --output ./nupkg
      
      # 1. Exchange GitHub OIDC token for a temporary NuGet API key
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: Redaessa

      # 2. Securely push to NuGet using the temporary API key
      - name: Push Package to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate